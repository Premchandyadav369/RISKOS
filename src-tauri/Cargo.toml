[package]
name = "riskos-desktop"
version = "2.0.0"
description = "RISKOS Institutional Desktop Workstation"
authors = ["Premchand Yadav"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["shell-open", "window-all", "system-tray", "global-shortcut"] }
num_cpus = "1.16"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
