name: RISKOS Institutional CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Node dependencies
      run: npm install

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Audit HTML DOM KaTeX Mathematical Expressions
      run: node tests/test_all_html_math.js

    - name: Run Native C++ & Rust Integration Suite
      run: node tests/test_rust_and_cpp_native_engines.js

    - name: Run Barra Factor Risk & Quant Research Suite
      run: node tests/test_factor_risk_and_quant_research.js

    - name: Run Proprietary Algorithms & Latency Suite
      run: node tests/test_proprietary_algorithms_and_latency.js

    - name: Run 41-Bot Fleet Live Profit Tests
      run: node tests/test_fleet_live_profit.js

    - name: Run Institutional Showcase Suite
      run: node tests/test_institutional_showcase_expansion.js

    - name: Run Complete Six Pillars Verification Suite
      run: node tests/test_all_institutional_six_pillars.js

    - name: Run Features 1, 2, 3, 6 & Fleet Profits Test Suite
      run: node tests/test_features_1_2_3_6_and_fleet_profits.js

    - name: Run Event Shock & Merton Jump Test Suite
      run: node tests/test_event_shock_engine.js

    - name: Run End-to-End Event Prediction Test Suite
      run: node tests/test_end_to_end_event_prediction.js

    - name: Run WebSeer Real-Time Crawler Test Suite
      run: node tests/test_web_seer.js

    - name: Run Long-Term Compounder Test Suite
      run: node tests/test_long_term_investment_engine.js

    - name: Run Sovereign 12-Factor Pricing Test Suite
      run: node tests/test_institutional_pricing_engine.js

    - name: Run FRED, EIA & CoinGecko Macro Telemetry Test Suite
      run: node tests/test_macro_data_feed.js

    - name: Run Real-Time Live Market Quotes Test Suite
      run: node tests/test_live_market_quotes.js

    - name: Run 24/7 Autonomous Daemon Test Suite
      run: node tests/test_riskos_daemon.js

    - name: Run Deep Platform Audit (0 Issues Enforced)
      run: node scripts/audit_deep_platform.js
